<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дневник — макеты 3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/caveat@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/caveat@5.3.0/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/pangolin@5.3.0/400.css">
<style>
  .light { --paper: #F6F8FB; --ink: #1C3A8A; --ink-soft: #3456A6; --ink-wet: #4D6BB5; --line: #DCE3F0; }
  .dark  { --paper: #101C35; --ink: #C3D0EE; --ink-soft: #8EA6D9; --ink-wet: #6E86BC; --line: #22325A; }
  /* шрифты: размеры подобраны так, чтобы строки были одной визуальной высоты */
  .f-pangolin { --font: "Pangolin"; --fs: 19px; --lh: 1.6; --date: 38px; --small: 16px; --dw: 400; }
  .f-caveat   { --font: "Caveat";   --fs: 25px; --lh: 1.35; --date: 48px; --small: 22px; --dw: 600; }

  body { margin: 0; background: #888; display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; }
  .phone { width: 384px; height: 854px; position: relative; overflow: hidden;
    background: var(--paper); color: var(--ink); font-family: var(--font), cursive; }
  .status { height: 30px; display: flex; justify-content: space-between; align-items: center;
    padding: 0 22px; font: 13px system-ui, sans-serif; color: var(--ink-soft); }

  header { padding: 30px 28px 0; position: relative; }
  .wd { font-size: var(--small); color: var(--ink-soft); }
  .date { font-size: var(--date); font-weight: var(--dw); line-height: 1.05; margin-top: 2px; }
  .icon-btn { position: absolute; right: 24px; top: 30px; color: var(--ink); }

  .entries { position: absolute; left: 28px; right: 28px; top: 150px; bottom: 150px; overflow: hidden; }
  .entries.end { display: flex; flex-direction: column; justify-content: flex-end; }
  .entry { margin-bottom: 30px; }
  .entry .t { font-size: var(--small); color: var(--ink-soft); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .entry .x { font-size: var(--fs); line-height: var(--lh); }
  .tag { color: var(--ink-soft); white-space: nowrap; }
  .foreign { color: var(--ink-soft); }
  .wet { color: var(--ink-wet); }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--ink); vertical-align: -0.18em; margin-left: 2px; border-radius: 1px; }
  .fade-b { position: absolute; left: 0; right: 0; bottom: 150px; height: 40px; background: linear-gradient(transparent, var(--paper)); }
  .fade-t { position: absolute; left: 0; right: 0; top: 150px; height: 40px; background: linear-gradient(var(--paper), transparent); }

  .bottom { position: absolute; left: 0; right: 0; bottom: 34px; }
  .timer { text-align: center; font-size: var(--small); color: var(--ink-soft); height: 24px; font-variant-numeric: tabular-nums; }
  .controls { display: grid; grid-template-columns: 1fr 68px 1fr; align-items: center; margin-top: 4px; }
  .langs { display: flex; gap: 24px; font-size: var(--small); color: var(--ink-soft); }
  .langs.l { justify-content: flex-end; padding-right: 28px; }
  .langs.r { justify-content: flex-start; padding-left: 28px; }
  .langs span { position: relative; }
  .langs .on { color: var(--ink); }
  .langs .on::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ink); }
  .langs .off { opacity: .35; }
  .mic { width: 68px; height: 68px; border-radius: 50%; background: var(--ink); display: flex; align-items: center; justify-content: center; }
  .navpill { position: absolute; bottom: 8px; left: 50%; width: 108px; margin-left: -54px; height: 4px; border-radius: 2px; background: var(--line); }

  .cal-h { padding: 30px 28px 0; display: flex; justify-content: space-between; align-items: flex-end; }
  .cal-h .m { font-size: var(--date); font-weight: var(--dw); line-height: 1.05; }
  .cal-h .y { font-size: var(--small); color: var(--ink-soft); }
  .cal-h .arrows { display: flex; gap: 22px; color: var(--ink-soft); padding-bottom: 8px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); padding: 34px 16px 0; row-gap: 4px; }
  .days .w { text-align: center; font-size: var(--small); color: var(--ink-soft); padding-bottom: 14px; }
  .days .d { height: 50px; display: flex; align-items: center; justify-content: center; position: relative; font-size: var(--fs); }
  .days .d.fut { color: var(--ink-soft); opacity: .55; }
  .days .d.has::after { content: ""; position: absolute; bottom: 4px; width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--ink); }
  .days .d.today span { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="out"></div>
<script>
const MIC = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--paper)" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>`;
const STOP = `<svg width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3" fill="var(--paper)"/></svg>`;
const SEARCH = `<svg class="icon-btn" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>`;
const L = (x) => `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${x}"/></svg>`;

const status = (t) => `<div class="status"><span>${t}</span><span>▮</span></div>`;
const head = `<header><div class="wd">понедельник</div><div class="date">9 ноября</div>${SEARCH}</header>`;
const bottom = (rec) => {
  const s = (x) => `<span class="${x === "RU" ? "on" : rec ? "off" : ""}">${x}</span>`;
  return `<div class="bottom"><div class="timer">${rec ? "1:24" : ""}</div><div class="controls">
    <div class="langs l">${s("RU")}${s("UK")}</div><div class="mic">${rec ? STOP : MIC}</div><div class="langs r">${s("EN")}${s("DE")}</div>
    </div></div><div class="navpill"></div>`;
};
const E = (t, x) => `<div class="entry"><div class="t">${t}</div><div class="x">${x}</div></div>`;
const E1 = E("7:42", `Проснулся раньше будильника. За окном первый снег, всё белое и тихое. Решил не торопиться и выпить кофе у окна. <span class="tag">#утро</span>`);
const E2 = E("9:15", `Созвон с командой. Обсудили <span class="foreign">roadmap</span> на декабрь, Марина предложила перенести релиз на неделю. Думаю, она права. <span class="tag">#работа</span>`);
const E3 = E("13:30", `Зайшов до мами. Ґанок увесь у листі, посиділи там із чаєм. Їжак знову приходив у сад — мама каже, він уже як свій. Є відчуття, що осінь цього року довга. <span class="tag">#семья</span>`);
const E4 = E("18:05", `Quick run along the river after work. Cold, but the light over the water was beautiful. <span class="tag">#спорт</span>`);
const E5 = E("21:40", `Вечером долго думал о том, что сказала Марина. Наверное, стоит поговорить с ней завтра утром, <span class="wet">пока не начался весь этот</span><span class="caret"></span>`);

const day = (theme, font, id) => `<div class="phone ${theme} f-${font}" id="${id}">${status("21:12")}${head}
  <div class="entries">${E1}${E2}${E3}</div><div class="fade-b"></div>${bottom(false)}</div>`;
const dict = (font) => `<div class="phone light f-${font}" id="dict-${font}">${status("21:41")}${head}
  <div class="entries end">${E2}${E3}${E4}${E5}</div><div class="fade-t"></div>${bottom(true)}</div>`;
const has = new Set([1, 3, 4, 5, 7, 8]);
const cal = (font) => {
  let c = ["пн","вт","ср","чт","пт","сб","вс"].map(w => `<div class="w">${w}</div>`).join("");
  for (let i = 0; i < 6; i++) c += `<div></div>`;
  for (let d = 1; d <= 30; d++) c += `<div class="d ${d > 9 ? "fut" : ""} ${has.has(d) ? "has" : ""} ${d === 9 ? "today" : ""}"><span>${d}</span></div>`;
  return `<div class="phone light f-${font}" id="cal-${font}">${status("21:13")}
    <div class="cal-h"><div><div class="y">2026</div><div class="m">ноябрь</div></div><div class="arrows">${L("M11.5 3.5 6 9l5.5 5.5")}${L("M6.5 3.5 12 9l-5.5 5.5")}</div></div>
    <div class="days">${c}</div><div class="navpill"></div></div>`;
};
const set = (f) => day("light", f, `day-${f}`) + dict(f) + cal(f) + day("dark", f, `dark-${f}`);
document.getElementById("out").outerHTML = set("pangolin") + set("caveat");
</script>
</body>
</html>

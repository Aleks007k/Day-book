<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дневник — лента дней</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5.3.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5.3.0/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.3.0/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.3.0/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/pangolin@5.3.0/400.css">
<style>
  .dark {
    --bg: #0D0C0B; --plate: #221F1B; --open: #2B2722; --track: #36322C; --line2: #3A352F;
    --text: #FFF8EC; --soft: #FFF3E2; --muted: #B3AA9C; --dim: #6E6962;
    --accent: #FFA01A; --on-accent: #1F1200; --accent-dark: #3A2A12; --rec: #FF3B30;
  }
  .light {
    --bg: #E9E4DC; --plate: #FFFFFF; --open: #FFFFFF; --track: #EEE9E2; --line2: #D8D1C6;
    --text: #15130F; --soft: #26221D; --muted: #625B52; --dim: #B3ACA2;
    --accent: #9A5400; --on-accent: #FFFFFF; --accent-dark: #F8EAD3; --rec: #D93A2F;
  }
  body { margin: 0; background: #555; display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; }
  .phone { width: 384px; height: 854px; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Manrope", sans-serif; }
  .status { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font: 600 13px "Manrope"; color: var(--muted); }

  .hdr { display: flex; align-items: center; padding: 8px 16px 10px 20px; }
  .hdr .t { flex: 1; font: 700 26px "Unbounded"; letter-spacing: -.3px; }
  .sq { width: 46px; height: 46px; border-radius: 14px; background: var(--plate); display: flex; align-items: center; justify-content: center; color: var(--text); box-sizing: border-box; }

  .feed { position: absolute; top: 94px; left: 0; right: 0; bottom: 96px; overflow: hidden; }
  .feed.end { display: flex; flex-direction: column; justify-content: flex-end; }
  .month { font: 700 12px "Manrope"; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); padding: 16px 18px 8px; }

  .day { display: grid; grid-template-columns: 1fr; padding: 6px 10px 7px; margin: 0 8px 4px; background: var(--plate); border-radius: 14px; align-items: center; }
  .num { text-align: center; }
  .num b { display: block; font: 700 21px "Unbounded"; line-height: 1.05; }
  .num i { display: block; font: normal 700 11px "Manrope"; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .day.today .num b { color: var(--accent); }
  .info { min-width: 0; }
  .info .meta { font: 600 12px "Manrope"; color: var(--muted); line-height: 1.35; white-space: nowrap; }
  .info .meta .dt { font-variant-numeric: tabular-nums; color: var(--soft); }
  .info .meta .acc { color: var(--accent); }
  .info .pre { font-family: "Pangolin"; font-size: 17px; line-height: 1.25; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--soft); }

  /* раскрытый день */
  .opened { background: var(--open); margin: 0 8px 4px; border-radius: 16px; }
  .opened .day { grid-template-columns: 1fr 24px; padding: 8px 10px 4px; margin: 0; background: none; }
  .opened .chev { color: var(--muted); }
  .body { padding: 2px 10px 10px 10px; }
  .e { font-family: "Pangolin"; font-size: 17.5px; line-height: 1.32; margin-bottom: 10px; }
  .e .tm { font: 700 12.5px "Unbounded"; color: var(--accent); margin-right: 6px; }
  .e .tag { font: 700 12px "Manrope"; color: var(--accent); white-space: nowrap; margin-left: 4px; }
  .foreign { color: var(--soft); text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .wet { color: var(--muted); }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); vertical-align: -0.18em; margin-left: 2px; border-radius: 1px; }

  .fade-b { position: absolute; left: 0; right: 0; bottom: 96px; height: 30px; background: linear-gradient(transparent, var(--bg)); }
  .dock { position: absolute; left: 16px; right: 16px; bottom: 26px; height: 62px; display: flex; gap: 10px; }
  .seg { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--plate); border-radius: 18px; padding: 4px; gap: 2px; box-sizing: border-box; }
  .seg span { display: flex; align-items: center; justify-content: center; border-radius: 14px; font: 700 13.5px "Unbounded"; color: var(--muted); }
  .seg span.on { background: var(--track); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); }
  .seg.locked span:not(.on) { color: var(--dim); }
  .mic { width: 104px; border-radius: 20px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
  .dock.rec .seg { display: flex; align-items: center; gap: 10px; padding: 0 16px; font: 700 18px "Unbounded"; }
  .dock.rec .dot { width: 11px; height: 11px; border-radius: 6px; background: var(--rec); }
  .dock.rec .seg small { font: 700 13px "Unbounded"; color: var(--muted); margin-left: auto; }
  .navpill { position: absolute; bottom: 8px; left: 50%; width: 108px; margin-left: -54px; height: 4px; border-radius: 2px; background: var(--line2); }
</style>
</head>
<body>
<div id="out"></div>
<script>
const I = (d, s = 22, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const SEARCH = I(`<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/>`);
const MIC = I(`<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/>`, 28, 2.1);
const STOP = `<svg width="22" height="22" viewBox="0 0 22 22"><rect x="3" y="3" width="16" height="16" rx="4" fill="currentColor"/></svg>`;
const UP = I(`<path d="M6 15l6-6 6 6"/>`, 20);

const status = (t) => `<div class="status"><span>${t}</span><span>▮▮</span></div>`;
const hdr = `<div class="hdr"><div class="t">Day book</div><div class="sq">${SEARCH}</div></div>`;
const dock = (rec) => rec
  ? `<div class="dock rec"><div class="seg"><span class="dot"></span>1:24<small>RU</small></div><div class="mic">${STOP}</div></div><div class="navpill"></div>`
  : `<div class="dock"><div class="seg">${["RU","UK","EN","DE"].map(l => `<span class="${l === "RU" ? "on" : ""}">${l}</span>`).join("")}</div><div class="mic">${MIC}</div></div><div class="navpill"></div>`;

const row = (date, meta, pre, today = false, open = false) =>
  `<div class="day ${today ? "today" : ""}"><div class="info"><div class="meta"><span class="dt">${date}</span>${today ? ` · <span class="acc">сегодня</span>` : ""} · ${meta}</div>${open ? "" : `<div class="pre">${pre}</div>`}</div>${open ? `<div class="chev">${UP}</div>` : ""}</div>`;

const days = [
  ["08.11.2026", "2 записи · <span class='acc'>семья</span>", "Весь день дома, разбирал старые фотографии. Нашёл снимки с моря"],
  ["07.11.2026", "1 запись", "Ходили с Олей в новый ресторан у парка, вкусно, но очень шумно"],
  ["05.11.2026", "3 записи · <span class='acc'>работа</span>", "Тяжёлый день. Три созвона подряд, к вечеру голова гудела"],
  ["04.11.2026", "1 запись · <span class='acc'>спорт</span>", "Первая пробежка после болезни, всего 3 км, но приятно"],
  ["03.11.2026", "2 записи", "Купил билеты на декабрь. Летим во Львов на четыре дня"],
  ["01.11.2026", "1 запись", "Ноябрь. Хочу в этом месяце каждый день писать хотя бы пару слов"],
];
const oct = [
  ["31.10.2026", "2 записи · <span class='acc'>семья</span>", "Хэллоуин у соседей, дети в костюмах, очень смешно"],
  ["30.10.2026", "1 запись", "Закрыли квартал. Можно выдохнуть и наконец поспать"],
  ["28.10.2026", "1 запись", "Gestern war ein langer Tag, aber endlich ist alles fertig"],
];
const today = row("09.11.2026", "4 записи · <span class='acc'>утро</span>", "Проснулся раньше будильника. За окном первый снег, всё белое и тихое", true);
const rest = days.map(d => row(...d)).join("") + `<div class="month">Октябрь 2026</div>` + oct.map(d => row(...d)).join("");

const entries = (live) => `
  <div class="e"><span class="tm">7:42</span>Проснулся раньше будильника. За окном первый снег, всё белое и тихое. Решил не торопиться и выпить кофе у окна.<span class="tag">#утро</span></div>
  <div class="e"><span class="tm">9:15</span>Созвон с командой. Обсудили <span class="foreign">roadmap</span> на декабрь, Марина предложила перенести релиз на неделю. Думаю, она права.<span class="tag">#работа</span></div>
  <div class="e"><span class="tm">13:30</span>Зайшов до мами. Ґанок увесь у листі, посиділи там із чаєм. Їжак знову приходив у сад — мама каже, він уже як свій.<span class="tag">#семья</span></div>
  <div class="e"><span class="tm">18:05</span>Quick run along the river after work. Cold, but the light over the water was beautiful.<span class="tag">#спорт</span></div>
  ${live ? `<div class="e"><span class="tm">21:40</span>Вечером долго думал о том, что сказала Марина. Наверное, стоит поговорить с ней завтра утром, <span class="wet">пока не начался весь этот</span><span class="caret"></span></div>` : ""}`;
const opened = (live) => `<div class="opened">${row("09.11.2026", `${live ? "5 записей" : "4 записи"} · <span class='acc'>утро</span>`, "", true, true)}<div class="body">${entries(live)}</div></div>`;

const feed = (theme, id) => `<div class="phone ${theme}" id="${id}">${status("21:12")}${hdr}
  <div class="feed"><div class="month">Ноябрь 2026</div>${today}${rest}</div><div class="fade-b"></div>${dock(false)}</div>`;
const open = `<div class="phone dark" id="open">${status("21:12")}${hdr}
  <div class="feed"><div class="month">Ноябрь 2026</div>${opened(false)}${rest}</div><div class="fade-b"></div>${dock(false)}</div>`;
const dict = `<div class="phone dark" id="dict">${status("21:41")}${hdr}
  <div class="feed"><div class="month">Ноябрь 2026</div>${opened(true)}${rest}</div><div class="fade-b"></div>${dock(true)}</div>`;

document.getElementById("out").outerHTML = feed("dark", "feed") + open + dict + feed("light", "light");
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дневник — макеты 2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/caveat@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/caveat@5.3.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/caveat@5.3.0/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/caveat@5.3.0/700.css">
<style>
  .light {
    --paper: #F7F9FC; --rule: #D3DDEE; --margin: #E9A9AE;
    --ink: #1C3A8A; --ink-soft: #3456A6; --ink-wet: #4D6BB5;
  }
  .dark {
    --paper: #101C35; --rule: #22325A; --margin: #5B3550;
    --ink: #C3D0EE; --ink-soft: #8EA6D9; --ink-wet: #6E86BC;
  }
  body { margin: 0; background: #888; display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; }
  .phone { width: 384px; height: 854px; position: relative; overflow: hidden;
    background: var(--paper); color: var(--ink); font-family: "Caveat", cursive; }
  .status { height: 30px; display: flex; justify-content: space-between; align-items: center;
    padding: 0 22px; font: 13px system-ui, sans-serif; color: var(--ink-soft); position: relative; z-index: 2; background: var(--paper); }

  /* лист в линейку с полем */
  .page { position: absolute; top: 30px; left: 0; right: 0; bottom: 0;
    --lh: 36px;
    background-image:
      linear-gradient(90deg, transparent 37px, var(--margin) 37px, var(--margin) 38.5px, transparent 38.5px),
      repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px), var(--rule) calc(var(--lh) - 1px) var(--lh));
    background-position: 0 0, 0 7px;
  }
  .page .content { position: absolute; left: 50px; right: 22px; top: 14px; bottom: 0; overflow: hidden; }
  .line { height: 36px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; height: 72px; padding-right: 2px; }
  .head .date { font-size: 44px; font-weight: 600; line-height: 1; padding-bottom: 6px; transform: rotate(-1.2deg); transform-origin: left bottom; }
  .head .wd { font-size: 26px; color: var(--ink-soft); line-height: 1; padding-bottom: 8px; }
  .entry { font-size: 25px; line-height: 36px; margin-bottom: 36px; }
  .entry .t { color: var(--ink-soft); font-weight: 600; margin-right: 4px; }
  .entry .tag { color: var(--ink-soft); white-space: nowrap; }
  .foreign { color: var(--ink-soft); }
  .wet { color: var(--ink-wet); }
  .caret { display: inline-block; width: 2px; height: 26px; background: var(--ink); vertical-align: -4px; margin-left: 2px; border-radius: 1px; }
  .search { position: absolute; right: 22px; top: 14px; color: var(--ink); }

  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 170px;
    background: linear-gradient(transparent, var(--paper) 40%); pointer-events: none; }
  .fade-top { position: absolute; left: 0; right: 0; top: 30px; height: 150px;
    background: linear-gradient(var(--paper) 72%, transparent); pointer-events: none; z-index: 1; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 26px; height: 110px; z-index: 2; }
  .rec { text-align: center; font-size: 22px; color: var(--ink-soft); height: 26px; }
  .controls { display: grid; grid-template-columns: 1fr 84px 1fr; align-items: center; }
  .langs { display: flex; gap: 22px; font-size: 25px; font-weight: 600; color: var(--ink-soft); }
  .langs.l { justify-content: flex-end; padding-right: 24px; }
  .langs.r { justify-content: flex-start; padding-left: 24px; }
  .langs span { position: relative; }
  .langs .on { color: var(--ink); }
  .langs .on svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -48%); }
  .langs .off { opacity: .4; }
  .mic { width: 84px; height: 84px; position: relative; display: flex; align-items: center; justify-content: center; }
  .mic > svg.ring { position: absolute; inset: 0; }
  .mic > svg:not(.ring) { position: relative; z-index: 1; }
  .navpill { position: absolute; bottom: 8px; left: 50%; width: 108px; margin-left: -54px; height: 4px; border-radius: 2px; background: var(--rule); z-index: 3; }

  /* календарь в клетку */
  .grid-paper { position: absolute; top: 30px; left: 0; right: 0; bottom: 0;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 23px, var(--rule) 23px 24px),
      repeating-linear-gradient(transparent 0 23px, var(--rule) 23px 24px);
    background-position: 0 0; }
  .cal { position: absolute; left: 24px; right: 24px; top: 48px; }
  .cal .title { display: flex; align-items: flex-end; justify-content: space-between; height: 72px; }
  .cal .m { font-size: 46px; font-weight: 600; line-height: 1; transform: rotate(-1.2deg); transform-origin: left bottom; }
  .cal .m small { font-size: 28px; font-weight: 500; color: var(--ink-soft); margin-left: 8px; }
  .cal .arrows { font-size: 34px; color: var(--ink-soft); display: flex; gap: 22px; padding-bottom: 4px; }
  .days { display: grid; grid-template-columns: repeat(7, 48px); grid-auto-rows: 48px; margin-top: 24px; }
  .days .wd { font-size: 22px; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; }
  .days .d { font-size: 27px; display: flex; align-items: center; justify-content: center; position: relative; }
  .days .d.future { color: var(--ink-soft); opacity: .6; }
  .days .d.we { }
  .days .d svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .cal .note { margin-top: 26px; font-size: 25px; color: var(--ink-soft); }
</style>
</head>
<body>
<div id="out"></div>
<script>
// «рукой нарисованные» элементы
const ring = (w, h, stroke = 1.8, fill = "none") =>
  `<svg class="ring" width="${w}" height="${h}" viewBox="0 0 100 100" preserveAspectRatio="none" fill="${fill}" stroke="var(--ink)" stroke-width="${stroke}" vector-effect="non-scaling-stroke" stroke-linecap="round"><path vector-effect="non-scaling-stroke" d="M56 6 C26 3 6 22 7 50 C8 78 30 96 56 94 C82 92 96 72 94 47 C92 22 74 6 44 9"/></svg>`;
const MIC = (c) => `<svg width="30" height="34" viewBox="0 0 30 34" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M15 4 C11 4 10.5 6 10.5 9 L10.5 16 C10.5 19.5 12 21 15 21 C18 21 19.5 19.5 19.5 16 L19.5 9 C19.5 6 18.5 4 15 4 Z"/><path d="M6.5 15.5 C6.5 22 10 26 15 26 C20 26 23.5 22 23.5 15"/><path d="M15 26.5 L15 31"/></svg>`;
const STOP = `<svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 4.5 C9 3.6 15 3.8 19.5 4.6 C20.4 9 20.2 15 19.4 19.5 C15 20.3 9 20.4 4.6 19.4 C3.8 15 3.9 9 5 4.5 Z" fill="var(--paper)"/></svg>`;
const SEARCH = `<svg class="search" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 3.5 C6.5 3.4 3.6 6.6 3.7 10.8 C3.8 15 7 18 11.2 17.8 C15.3 17.6 18 14.6 17.8 10.5 C17.6 6.6 14.8 3.8 10.2 4.2"/><path d="M16.2 16.4 L22.4 22.6"/></svg>`;

const status = (t) => `<div class="status"><span>${t}</span><span>▮</span></div>`;
const head = `<div class="head"><span class="date">9 ноября</span><span class="wd">понедельник</span></div>`;

const langs = (rec) => {
  const L = (x) => x === "RU" ? `<span class="on">${ring(46, 40, 1.6)}${x}</span>` : `<span class="${rec ? "off" : ""}">${x}</span>`;
  return [`<div class="langs l">${L("RU")}${L("UK")}</div>`, `<div class="langs r">${L("EN")}${L("DE")}</div>`];
};
const bottom = (rec) => {
  const [l, r] = langs(rec);
  const mic = rec
    ? `<div class="mic">${ring(84, 84, 2, "var(--ink)")}${STOP}</div>`
    : `<div class="mic">${ring(84, 84, 2)}${MIC("var(--ink)")}</div>`;
  return `<div class="fade"></div><div class="bottom"><div class="rec">${rec ? "пишу… 1:24" : ""}</div>
    <div class="controls">${l}${mic}${r}</div></div><div class="navpill"></div>`;
};

const E1 = `<div class="entry"><span class="t">7:42</span> Проснулся раньше будильника. За окном первый снег, всё белое и тихое. Решил не торопиться и выпить кофе у окна. <span class="tag">#утро</span></div>`;
const E2 = `<div class="entry"><span class="t">9:15</span> Созвон с командой. Обсудили <span class="foreign">roadmap</span> на декабрь, Марина предложила перенести релиз на неделю. Думаю, она права. <span class="tag">#работа</span></div>`;
const E3 = `<div class="entry"><span class="t">13:30</span> Зайшов до мами. Ґанок увесь у листі, посиділи там із чаєм. Їжак знову приходив у сад — мама каже, він уже як свій. Є відчуття, що осінь цього року довга. <span class="tag">#семья</span></div>`;
const E4 = `<div class="entry"><span class="t">18:05</span> Quick run along the river after work. Cold, but the light over the water was beautiful. <span class="tag">#спорт</span></div>`;
const E5 = `<div class="entry"><span class="t">21:40</span> Вечером долго думал о том, что сказала Марина. Наверное, стоит поговорить с ней завтра утром, <span class="wet">пока не начался весь этот</span><span class="caret"></span></div>`;

const day = (theme) => `<div class="phone ${theme}" id="d-${theme}">${status("21:12")}
  <div class="page"><div class="content">${head}${E1}${E2}${E3}</div>${SEARCH}</div>${bottom(false)}</div>`;

const dict = `<div class="phone light" id="dictation">${status("21:41")}
  <div class="page"><div class="content" id="dictc">${E3}${E4}${E5}</div></div>
  <div class="fade-top"></div>
  <div class="page" style="background:none;z-index:1;bottom:auto;height:110px"><div class="content">${head}</div>${SEARCH}</div>
  ${bottom(true)}</div>`;

const has = new Set([1, 3, 4, 5, 7, 8, 9]);
let cells = ["пн","вт","ср","чт","пт","сб","вс"].map(w => `<div class="wd">${w}</div>`).join("");
for (let i = 0; i < 6; i++) cells += `<div></div>`;
const tick = `<svg width="34" height="10" viewBox="0 0 34 10" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" style="top:auto;bottom:4px;transform:translateX(-50%)"><path d="M3 6 C10 3.5 22 3 31 4.5"/></svg>`;
for (let d = 1; d <= 30; d++) {
  const cls = d > 9 ? "future" : "";
  let deco = "";
  if (d === 9) deco = ring(48, 44, 1.8).replace('class="ring"', '');
  else if (has.has(d)) deco = tick;
  cells += `<div class="d ${cls}">${deco}<span>${d}</span></div>`;
}
const cal = `<div class="phone light" id="calendar">${status("21:13")}<div class="grid-paper"></div>
  <div class="cal"><div class="title"><span class="m">Ноябрь<small>2026</small></span><span class="arrows"><span>‹</span><span>›</span></span></div>
  <div class="days">${cells}</div>
  <div class="note">подчёркнуто — есть записи</div></div><div class="navpill"></div></div>`;

document.getElementById("out").outerHTML = day("light") + dict + cal + day("dark");
const dc = document.getElementById("dictc"); dc.style.bottom = "auto";
const h = dc.scrollHeight - 36, target = 854 - 30 - 150;
dc.style.top = (14 + 36 * Math.floor((target - h - 14) / 36) + 144) + "px"; dc.style.overflow = "visible";
</script>
</body>
</html>
